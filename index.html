<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- no pinch/double-tap zoom; draw under notches (we pad with safe-area insets) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1d2b1a" />
    <title>Joguin dos Menino</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        /* read by src/ui/safeArea.js so the HUD avoids notches and home bars */
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1d2b1a;
        /* the game owns every touch: no scrolling, zooming, pull-to-refresh or text selection */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh; /* mobile: excludes the browser's address bar */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
